name: Deploy to Cloudflare

on:
  push:
    branches: [claude/bj-residence-website-92aeo4]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1d00f1997bfa1db6b2bb9603cd3e7c5f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run cf:deploy
      - name: Deploy cron worker
        working-directory: cron-worker
        run: npm ci && npx wrangler deploy
